name: Terraform Azure CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Add Terraform to PATH
        shell: powershell
        run: |
          $terraformPath = "C:\Users\harsh.sharma\AppData\Local\Microsoft\WinGet\Packages\Hashicorp.Terraform_Microsoft.Winget.Source_8wekyb3d8bbwe"
          Add-Content -Path $env:GITHUB_PATH -Value $terraformPath

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ '0abf8a0c-4139-44cf-835c-b78f26da31b5' }}
          tenant-id: ${{ '093e9319-5648-4618-8c7d-f585fb2ed3f9' }}
          subscription-id: ${{ '2eeb0869-d474-4f94-a0b0-fb6a5d23d142' }}

      - name: Check Azure Account
        shell: powershell
        run: |
          az account show

      - name: Check Terraform Version
        shell: powershell
        run: |
          terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve